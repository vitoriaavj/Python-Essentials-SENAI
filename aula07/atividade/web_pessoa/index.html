<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD WEB - Python</title>

    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <div id="geral">
        <H2>Pessoas</H2>

        <form id="form-pessoa">
            <label for="nome">Nome</label>
            <input type="text" name="nome" class="input-01" required maxlength="60" placeholder="Informe o nome">

            <label for="Data de nascimento">Data de nascimento</label>
            <input type="date" name="Data de nascimento" id="Data de nascimento" class="input-02" required
                maxlength="60" placeholder="Informe a data de nascimento">

            <label for="Sexo">Sexo</label>
            <input type="radio" name="sexo" id="sexo-M" value="M" required> Masculino
            <input type="radio" name="sexo" id="sexo-F" value="F" readonly> Feminino

            <label for="Altura">Altura</label>
            <input type="mumber" name="altura" id="altura" class="imput-02" required maxlength="6"
                placeholder="Informe a altura">

            <label for="peso">Peso</label>
            <input type="number" name="peso" id="peso" class="input-02" required maxlength="6"
                placeholder="Informe o peso">

            <div id="div-btns">
                <button type="submit" id="btn-add"> Adicionar </button>
                <button type="reset" id="btn-limpar"> Limpar </button>
            </div>


        </form>

        <div id="div-lista">
            <div class="div-pessoa">
            </div>
        </div>

</body>

</html>
