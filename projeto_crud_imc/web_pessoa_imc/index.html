<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD WEB - Python</title>

    <link rel="stylesheet" href="./css/style.css">

    <script src="js/scripts.js" type="module" defer></script>

</head>

<body>
    <div id="geral">
        <h2> Pessoas </h2>

        <form id="form-pessoa">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" class="input-01" required maxlength="60"
                placeholder="Informe o nome">

            <label for="data-nascimento">Data Nascimento</label>
            <input type="date" name="data-nascimento" id="data-nascimento" class="input-01" required maxlength="60"
                placeholder="Informe o Data de Nascimento">

            <label for="sexo">Sexo</label>
            <input type="radio" name="sexo" id="sexo-m" value="M" required> Masculino
            <input type="radio" name="sexo" id="sexo-f" value="F" required> Feminino

            <label for="altura">Altura</label>
            <input type="text" name="altura" id="altura" class="input-02" required maxlength="6"
                placeholder="Informe a Altura">

            <label for="peso">Peso</label>
            <input type="text" name="peso" id="peso" class="input-02" required maxlength="6"
                placeholder="Informe o peso">

            <div id="div-btns">
                <button type="submit" id="btn-add"> Adicionar </button>
                <button type="reset" id="btn-limpar"> Limpar</button>
            </div>

        </form>

                    title="Alterar"> A </a> <a href="#" alt="Excluir" title="Excluir"> E </a>
            </div>

        </div>

    </div>

    
</body>


</html>
